workspace:
  inheritedTasks:
    include:
      - scad.docs
      - scad.build
      - scad.verify

tasks:
  scad.docs:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/design/**'

  scad.build:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/render.yml'

  scad.verify:
    inputs:
      - 'openscad/**/*.scad'
      - 'test/**'
      - 'vrf/**'
      - 'scripts/**'
      - 'project.yml'
      - 'project.scad.yml'
      - 'ext/lib.scad.util'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'update-repo.sh'
      - 'update-repo.ps1'
      - '.github/workflows/**'
      - 'tools/tool.git-project'
